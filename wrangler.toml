name = "goobercord"
main = "worker.mjs"
compatibility_date = "2026-10-13"
workers_dev = true

[vars]
TURNSTILE_HOSTNAMES = "goobercord.itswempo.workers.dev"
# Release-grade stamp (the owner's rubric-4 ask): /api/version + the
# stale-build meta tags carry VERSION@COMMIT_SHA. 1.0.0 = the 1.0 battery's
# verdict (owner: "run EVERY SINGLE ... THEN AFTER ALL OF THAT ITS 1.0") —
# pnpm audit 0 vulns, secrets clean, suites green, actions hash-pinned,
# OWASP + frontend engines no findings ≥0.8, the quality gate's 2 CRITICAL
# + 2 HIGH bind-mismatch heals proven by tests/guard-binds.test.mjs and
# deployed green.
VERSION = "1.0.0"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Shared production D1: wempos-forum binds the same database_id as FORUM_DB.
# GooberCord reads/writes session, user, ban, and known-ip rows in that one
# database — the parity contract in tests/contract-parity.test.mjs keeps the
# two apps' SQL for those tables identical.
[[d1_databases]]
binding = "GOOBER_DB"
database_name = "wempo-forum-data"
database_id = "e648d306-2c2b-4ddc-aaf1-cef2e023a88c"
migrations_dir = "migrations"

# Shared production R2 (the R2 revival): one bucket for both apps. The forum
# already writes avatars/<id> here (byte-verified 2026-11-18); GC's lane reads
# the same avatars and writes its own gc-attachments/<attachment id> objects
# (api/media.mjs). The D1 tables stay — they are the serving fallback when an
# object has not landed yet.
[[r2_buckets]]
binding = "GC_MEDIA"
bucket_name = "wempos-forum-r2"

# Rate limiters are GooberCord's own (binding names GC_*; ids in a fresh
# range), so the two apps never contend for each other's throttle.
[[ratelimits]]
name = "GC_READ_RATE_LIMITER"
namespace_id = "614202610143101"
[ratelimits.simple]
limit = 180
period = 60

[[ratelimits]]
name = "GC_WRITE_RATE_LIMITER"
namespace_id = "614202610143102"
[ratelimits.simple]
limit = 45
period = 60

[[ratelimits]]
name = "GC_GUEST_RATE_LIMITER"
namespace_id = "614202610143103"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "GC_REGISTER_RATE_LIMITER"
namespace_id = "614202610143104"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "GC_LOGIN_RATE_LIMITER"
namespace_id = "614202610143105"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "GC_MESSAGE_RATE_LIMITER"
namespace_id = "614202610143106"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "GC_UPLOAD_RATE_LIMITER"
namespace_id = "614202610143107"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "GC_PASSWORD_RATE_LIMITER"
namespace_id = "614202610143108"
[ratelimits.simple]
limit = 6
period = 60

[[ratelimits]]
name = "GC_TOTP_RATE_LIMITER"
namespace_id = "614202610143109"
[ratelimits.simple]
limit = 10
period = 60

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ChatRoom"
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceHub"

# Credential relay: DIRECT invocation of the forum worker (same account).
# An internet fetch from GC to wempos-forum.itswempo.workers.dev 404s at the
# edge without ever reaching the forum worker (same-zone subrequest routing
# does not enter sibling workers.dev scripts), so the relay rides a service
# binding instead: no hop, no interception, token still required.
[[services]]
binding = "FORUM_WORKER"
service = "wempos-forum"

# Wempo Accounts handshake: DIRECT invocation of the accounts worker (same
# account), the FORUM_WORKER precedent. The one-time sign-in ticket that
# accounts mints after its own login is redeemed here through this binding —
# POST https://sso.internal/api/sso/redeem with the shared RELAY_TOKEN
# (api/sso.mjs); an internet fetch to accounts.itswempo.workers.dev would
# 404 at the edge just like the forum call above (same-zone subrequest
# routing never enters a sibling workers.dev script).
[[services]]
binding = "ACCOUNTS_WORKER"
service = "accounts"

# Cloudflare's free plan refuses `new_classes` for DO migrations — fresh
# accounts/deployments must use new_sqlite_classes (SQLite-backed DOs),
# which is also what the DOs actually use.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom", "PresenceHub"]
