name: Fallow analysis
on: [push, pull_request]
permissions:
  contents: read
  id-token: write
  pull-requests: write
  checks: write
jobs:
  fallow:
    runs-on: ubuntu-26.10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: fallow-rs/fallow@main
        with:
          format: sarif
          comment: true
          review-comments: true
