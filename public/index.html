<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="gc.app.title">GooberCord</title>
  <meta name="description" content="GooberCord — chat for my friends">
  <!-- Favicon: blaxel is the brand face in the app itself, so he is the tab
       icon too. (Not stamped: an immutable PNG already revalidates by its
       content-derived ETag.) -->
  <link rel="icon" type="image/png" href="/assets/blaxel.png">
  <!-- Browser chrome follows the effective theme before first paint. The
       media-query pair gives a good browser-chrome guess; a manual toggle
       re-paints both metas through the Kit appearance engine. -->
  <meta name="theme-color" content="#f7efdc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131b27" media="(prefers-color-scheme: dark)">
  <!-- The color-scheme hint is the runtime source ("light dark" = follow the
       system; theme-preload pins it from the stored choice). styles.css maps
       the hint back to the property — CSS never hardcodes a pin. -->
  <meta name="color-scheme" content="light dark">
  <!-- Skin before first paint (CSP-safe: same-origin script, no inline).
       Settles the document's data-theme from the stored preference. -->
  <script src="/js/theme-preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <!-- The §4b door-swap: GooberCord renders no Turnstile widget and has no
       sign-in page — sign-in and registration ride Wempo Accounts' pages,
       and the client redirects every signed-out open there. -->
  <!-- SPA entry. app-build stamp is injected by worker.mjs before the closing
       head element. NOTE: no comment in this file may carry the head-close
       bytes immediately before a body open (the anchored injector would put
       the stamp inside the comment; the old client's index.html was once
       bitten by exactly that, pinned by tests/stale-stamp-comment.test.mjs). -->
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div id="app">
    <noscript><p class="empty-state">GooberCord needs JavaScript to run.</p></noscript>
  </div>
</body>
</html>
