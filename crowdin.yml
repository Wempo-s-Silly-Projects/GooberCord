# Crowdin config for the GooberCord locale bundles (GitHub app / CLI parity).
# Source: public/locales/en.json (455+ keys). Targets are the 8 seated
# bundles. Files must stay key-complete JSON and pass tests/locale-bundle*.mjs.
api_version: "2"

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

base_path: "."
base_url: "https://api.crowdin.com"

preserve_hierarchy: true

files:
  - source: /public/locales/en.json
    translation: /public/locales/%two_letters_code%.json
    # %two_letters_code% resolves to the seated codes: ar de es fr ja pt ru zh
    update_option: update_as_unapproved
    translators_before_approving: 0
    content_segmentation: 0

commit_message: "i18n: sync locale bundles from [cp:%original_file_name%] (%language%)"
